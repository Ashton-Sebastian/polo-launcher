plugins { id 'com.android.application' }

android {
    namespace 'com.polo6r.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.polo6r.launcher'
        minSdk 21          // works on old and new head units
        targetSdk 35
        versionCode 12
        versionName '2.0'
    }
    // Updates only install over an app signed with the same key, so the key lives with the project.
    signingConfigs {
        polo {
            storeFile rootProject.file('../signing/polo-launcher.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.polo }
        release { minifyEnabled false; signingConfig signingConfigs.polo }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
