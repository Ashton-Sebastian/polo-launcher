<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polo Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="bg"></div>

  <aside class="rail" id="rail"></aside>

  <div class="handle"></div>

  <div class="status">
    <span id="tempTxt" class="temp"></span>
    <button class="fuelchip" id="fuelChip" aria-label="Fuel level">
      <span class="ic" data-icon="pump"></span>
      <span class="mini"><i id="fuelMini"></i></span>
      <span id="fuelPct">--%</span>
    </button>
    <span class="ic net" id="netIcon" aria-label="Network"></span>
    <span class="ic bt" data-icon="bt"></span>
    <span id="clock">--:--</span>
  </div>

  <main>
    <!-- HOME -->
    <section id="home" class="screen active">
      <div class="pager" id="pager"><div class="pages" id="pages"></div></div>
      <div class="dots" id="dots"></div>
      <div class="editbar"><span>Drag tiles to move them · hold at the edge to change page · tap to change the app</span><button id="editDone" class="btn">Done</button></div>
      <div class="def-banner" id="updBanner">
        <button id="updInstall">Update available – tap to install</button>
        <button id="updHide" aria-label="Hide">✕</button>
      </div>
      <div class="def-banner" id="defBanner">
        <button id="defMake">Make Polo Launcher your default home screen</button>
        <button id="defHide" aria-label="Hide">✕</button>
      </div>
    </section>

    <!-- VEHICLE -->
    <section id="vehicle" class="screen">
      <nav class="tabs" id="tabs">
        <button data-tab="0" class="on">Since start</button>
        <button data-tab="1">Since refuelling</button>
        <button data-tab="2">Long-term</button>
        <i class="ink" id="ink"></i>
      </nav>

      <div class="veh-body">
        <div class="left">
          <div class="label">Range</div>
          <div class="range" id="rangeRow">
            <span class="ic" data-icon="pump"></span>
            <b id="range">--</b><small>km</small>
          </div>

          <div class="fuel" id="fuelBox">
            <div class="label">Fuel level <span id="fuelWarn" class="warn">Reserve</span></div>
            <div class="gauge">
              <div class="fill" id="fuelFill"></div>
              <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="ends"><span>E</span><span id="fuelText">-- l</span><span>F</span></div>
          </div>
          <div class="carline" id="carLine"></div>
        </div>
        <div class="car"><img src="car.png" alt="" id="carImg"></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="v"><span class="ic" data-icon="dist"></span><b id="sDist">--</b><small>km</small></div><div class="k">Distance</div></div>
        <div class="stat"><div class="v"><span class="ic" data-icon="clock"></span><b id="sTime">--</b><small>h</small></div><div class="k">Time</div></div>
        <div class="stat" id="consStat"><div class="v"><span class="ic" data-icon="pump"></span><b id="sCons">--</b><small id="sConsU">km/l</small></div><div class="k">Consumption</div></div>
        <div class="stat"><div class="v"><span class="ic" data-icon="speedo"></span><b id="sAvg">--</b><small>km/h</small></div><div class="k">Avg. speed</div></div>
      </div>

      <div class="demo-badge" id="demoBadge">Demo data – real car data not connected yet (Launcher › Find car data)</div>
    </section>
  </main>

  <!-- App picker / settings sheet -->
  <div id="sheet" class="sheet">
    <div class="sheet-card">
      <header><h2 id="sheetTitle">Choose app</h2><button id="sheetClose" aria-label="Close">✕</button></header>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="splash"><img src="vw-logo.svg" alt=""></div>
</div>
<script src="app.js"></script>
</body>
</html>
