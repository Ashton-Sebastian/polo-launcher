<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 560 230">
  <!-- Stylised white VW Polo 6R 5-door, side view. Replace car.svg with car.png of your own car if you like. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#f3f6fa"/>
      <stop offset=".46" stop-color="#d9e0e8"/>
      <stop offset=".62" stop-color="#eef2f6"/>
      <stop offset=".9" stop-color="#c3ccd6"/>
      <stop offset="1" stop-color="#9aa6b3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3b4c"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fc4e8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#bfe0ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9fc4e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#f2f5f8"/>
      <stop offset=".6" stop-color="#b9c2cc"/>
      <stop offset="1" stop-color="#6d7783"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset=".5" stop-color="#7f8d9c"/>
      <stop offset="1" stop-color="#2b3540"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#8a0d12"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="600" height="192"/></clipPath>
    <g id="wheel">
      <circle r="40" fill="#121418"/>
      <circle r="38" fill="none" stroke="#2a2e35" stroke-width="2"/>
      <circle r="28" fill="url(#rim)"/>
      <g fill="#59626e">
        <path d="M-4 -26 L4 -26 L3 -8 L-3 -8Z"/>
        <path d="M-4 -26 L4 -26 L3 -8 L-3 -8Z" transform="rotate(72)"/>
        <path d="M-4 -26 L4 -26 L3 -8 L-3 -8Z" transform="rotate(144)"/>
        <path d="M-4 -26 L4 -26 L3 -8 L-3 -8Z" transform="rotate(216)"/>
        <path d="M-4 -26 L4 -26 L3 -8 L-3 -8Z" transform="rotate(288)"/>
      </g>
      <circle r="27" fill="none" stroke="#e9eef3" stroke-width="1.2" opacity=".7"/>
      <circle r="8" fill="#d6dce3" stroke="#6d7783" stroke-width="1"/>
      <circle r="3.2" fill="#1d3b78"/>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="298" cy="212" rx="272" ry="11" fill="#000d26" opacity=".55"/>

  <!-- wheel wells -->
  <g clip-path="url(#above)" fill="#07090d">
    <circle cx="130" cy="170" r="47"/>
    <circle cx="455" cy="170" r="47"/>
  </g>

  <!-- body -->
  <path fill="url(#body)" stroke="#8d99a6" stroke-width=".8" d="
    M 45 192 L 38 176 Q 32 160 35 146 L 39 129 Q 44 118 62 113
    L 205 89 L 284 31 Q 292 21 308 20 Q 400 16 455 23 Q 506 30 526 43
    L 545 84 L 551 120 Q 558 142 556 170 L 551 192 L 498 192
    A 48 48 0 1 0 412 192 L 173 192 A 48 48 0 1 0 87 192 Z"/>

  <!-- side glass -->
  <path fill="url(#glass)" d="M 214 91 L 287 36 Q 294 29 308 29 Q 400 25 452 31 Q 493 37 507 48 L 521 74 Q 522 79 515 79 Z"/>
  <path fill="url(#refl)" d="M 250 70 L 300 32 L 360 32 L 300 86 Z"/>
  <!-- B pillar (black) and C pillar (body colour) -->
  <path fill="#0b0e13" d="M 337 29 L 348 29 L 346 87 L 334 88 Z"/>
  <path fill="#f4f7fa" stroke="#aab4bf" stroke-width=".6" d="M 438 29 L 468 33 L 490 79 L 430 82 Z"/>
  <!-- rear spoiler -->
  <path fill="#1a1f26" d="M 452 20 Q 506 26 529 41 L 526 45 Q 504 31 452 24 Z"/>

  <!-- shoulder line -->
  <path d="M 66 117 L 548 95" stroke="#ffffff" stroke-width="2.2" opacity=".9"/>
  <path d="M 66 119.5 L 548 97.5" stroke="#9aa6b3" stroke-width="1" opacity=".8"/>
  <!-- lower crease -->
  <path d="M 178 168 L 405 166" stroke="#a7b2bd" stroke-width="1.2" opacity=".8"/>

  <!-- door shut lines -->
  <g fill="none" stroke="#6f7b88" stroke-width="1.1">
    <path d="M 207 96 Q 199 140 204 187"/>
    <path d="M 340 90 L 338 189"/>
    <path d="M 430 84 Q 448 118 444 146 Q 436 170 410 186"/>
  </g>
  <!-- door handles -->
  <rect x="292" y="104" width="24" height="5" rx="2.5" fill="#c9d1da" stroke="#7b8794" stroke-width=".7"/>
  <rect x="404" y="99" width="24" height="5" rx="2.5" fill="#c9d1da" stroke="#7b8794" stroke-width=".7"/>

  <!-- mirror -->
  <path fill="#f6f8fb" stroke="#8d99a6" stroke-width=".8" d="M 220 92 Q 212 79 228 76 L 249 78 Q 254 86 245 93 Z"/>
  <path fill="#1a1f26" d="M 222 92 L 246 93 L 244 96 L 224 95 Z"/>

  <!-- headlight -->
  <path fill="url(#lamp)" stroke="#55606c" stroke-width=".7" d="M 41 129 L 76 118 L 98 120 L 82 133 L 44 139 Z"/>
  <!-- front bumper intake & fog light -->
  <path fill="#11151b" d="M 37 166 L 72 167 L 74 181 L 42 183 Z"/>
  <circle cx="58" cy="174" r="4" fill="#cfd6de"/>
  <!-- tail light -->
  <path fill="url(#tail)" stroke="#5a0a0d" stroke-width=".7" d="M 536 86 L 547 88 L 552 119 L 539 116 Z"/>
  <!-- rear bumper reflector line -->
  <path d="M 545 160 L 555 160" stroke="#a01218" stroke-width="2.5"/>

  <!-- sill -->
  <path d="M 173 190 L 412 190" stroke="#4b5560" stroke-width="3"/>

  <!-- wheels -->
  <use href="#wheel" x="130" y="170"/>
  <use href="#wheel" x="455" y="170"/>
</svg>
